<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin – Case Studies</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      font-family: Inter, sans-serif;
      background: #f4f6f5;
      max-width: 1200px;
      margin: auto;
      padding: 24px;
    }

    .layout {
      display: grid;
      grid-template-columns: 280px 1fr 1fr;
      gap: 20px;
    }

    .panel {
      background: #fff;
      padding: 16px;
      border-radius: 8px;
    }

    .item {
      padding: 8px;
      border-bottom: 1px solid #eee;
      cursor: grab;
    }

    .item.active {
      background: #edf2ee;
      font-weight: 600;
    }

    input, textarea, select {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
    }

    textarea {
      min-height: 160px;
      font-family: monospace;
    }

    .preview {
      border-left: 1px solid #eee;
    }

    button {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    .primary { background: #0b3a2a; color: white; }
    .secondary { background: #e5e7eb; }
    .danger { background: #b91c1c; color: white; }

    pre {
      background: #111;
      color: #0f0;
      padding: 12px;
      max-height: 200px;
      overflow: auto;
    }
  </style>
</head>

<body>

<h1>Case Studies Admin</h1>

<div class="layout">

  <!-- LIST + ORDER -->
  <div class="panel">
    <button class="secondary" onclick="newEntry()">+ New</button>
    <div id="list"></div>
  </div>

  <!-- EDITOR -->
  <div class="panel">
    <input id="id" disabled placeholder="ID">
    <input id="title" placeholder="Title">
    <input id="subtitle" placeholder="Subtitle">
    <input id="image" placeholder="Image path">

    <select id="theme">
      <option>purple</option>
      <option>green</option>
      <option>orange</option>
      <option>dark</option>
      <option>yellow</option>
    </select>

    <h4>SEO</h4>
    <input id="seoTitle" placeholder="SEO Title">
    <input id="seoDesc" placeholder="SEO Description">

    <select id="published">
      <option value="true">Published</option>
      <option value="false">Draft</option>
    </select>

    <textarea id="content" placeholder="Markdown content"></textarea>

    <button class="primary" onclick="save()">Save</button>
    <button class="danger" onclick="remove()">Delete</button>
    <button class="secondary" onclick="exportJson()">Export JSON</button>

    <pre id="output"></pre>
  </div>

  <!-- LIVE PREVIEW -->
  <div class="panel preview">
    <h3>Live Preview</h3>
    <div id="preview"></div>
  </div>

</div>

<script src="admin-ui.js"></script>
</body>
</html>
