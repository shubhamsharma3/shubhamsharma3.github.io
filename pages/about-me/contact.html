<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact — Shubham Sharma</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/css/nav.css">
<link rel="stylesheet" href="/css/base.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* PAGE */

body {
  font-family: Inter, sans-serif;
  background: #f7f7f7;
  color: #111;
}


/* CONTAINER */

.contact-container {

  max-width: 760px;

  margin: 140px auto 80px auto;

  padding: 0 28px;

}


/* QUOTE */

.quote {

  font-size: 26px;

  font-weight: 600;

  text-align: center;

  margin-bottom: 20px;

}

.quote span {

  color: #ff6a00;

}


/* SUBTEXT */

.subtext {

  text-align: center;

  font-size: 18px;

  color: #555;

  margin-bottom: 50px;

}


/* FORM */

form {

  display: flex;

  flex-direction: column;

}


label {

  font-weight: 600;

  margin-bottom: 6px;

}


.required {

  color: red;

}


/* INPUT */

input,
textarea {

  padding: 12px;

  border-radius: 6px;

  border: 1px solid #ccc;

  margin-bottom: 28px;

  font-size: 15px;

  font-family: inherit;

}


textarea {

  height: 140px;

  resize: vertical;

}


/* BUTTON */

button {

  background: #1e6fa8;

  color: white;

  border: none;

  padding: 12px 22px;

  font-size: 16px;

  border-radius: 6px;

  cursor: pointer;

  width: fit-content;

}

button:hover {

  background: #155a89;

}

</style>

</head>
<body>


<!-- NAV -->
<nav>
<a href="/index.html" class="logo">
  Shubham<br />
  Sharma.
</a>


  <div class="actions">

    <!-- ABOUT ME DROPDOWN -->
    <div class="dropdown">
      <a href="#" class="dropbtn">👋 About Me</a>

      <div class="dropdown-content">
        <a href="pages/about-me/resume.html">Résumé</a>
        <!-- <a href="side-projects.html">Side Projects</a> -->
        <a href="pages/about-me/product-philosophy.html">Product Philosophy</a>
        <!-- <a href="my-story.html">My Story</a> -->
        <!-- <a href="manager-readme.html">Manager README</a> -->
        <a href="pages/about-me/contact.html">Contact</a>
      </div>
    </div>

    <a href="/index.html#works">My Works</a>

  </div>
</nav>



<!-- CONTACT CONTENT -->

<div class="contact-container">


<div class="quote">
“All we need to do is make sure we <span>keep talking.</span>” — Pink Floyd
</div>


<div class="subtext">
Fill out the form below and I’ll be in touch!
</div>


<form action="mailto:shubhamjksharma.portfolio@gmail.com" method="POST" enctype="text/plain">


<label>Name <span class="required">*</span></label>
<input type="text" name="Name" required>


<label>Email <span class="required">*</span></label>
<input type="email" name="Email" required>


<label>Message <span class="required">*</span></label>
<textarea name="Message" required></textarea>


<button type="submit">
Send
</button>


</form>


</div>


<script>

const currentPath = window.location.pathname;

// highlight About section if inside about pages
const isAboutPage =
  currentPath.includes("/about-me/")
  || currentPath.includes("resume.html")
  || currentPath.includes("contact.html")
  || currentPath.includes("my-story.html")
  || currentPath.includes("manager-readme.html")
  || currentPath.includes("side-projects.html");

if (isAboutPage) {

  const dropdown = document.querySelector(".dropdown");

  if (dropdown) {
    dropdown.classList.add("active");
  }

}

// highlight exact dropdown link
document.querySelectorAll(".dropdown-content a").forEach(link => {

  const linkPath = new URL(link.href).pathname;

  if (currentPath === linkPath) {
    link.classList.add("active");
  }

});

</script>
</body>
</html>
